<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BrainFlip</title>
    <meta name="description" content="Timed quizzes and 3D flip flashcards for exam prep." />
    <link
      rel="icon"
      type="image/png"
      href="https://res.cloudinary.com/j7xyduzb/image/upload/v1791200860/brain_logo_1.png"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Sora:wght@600;700&display=swap"
    />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/shell.css" />
    <link rel="stylesheet" href="css/screens/home.css" />
    <link rel="stylesheet" href="css/screens/decks.css" />
    <link rel="stylesheet" href="css/screens/quiz.css" />
    <link rel="stylesheet" href="css/screens/results.css" />
    <link rel="stylesheet" href="css/screens/review.css" />
    <link rel="stylesheet" href="css/screens/flashcards.css" />
    <link rel="stylesheet" href="css/screens/progress.css" />
  </head>
  <body>
    <a class="skip-link" href="#screen">Skip to content</a>

    <header class="topbar">
      <button
        class="menu-btn"
        id="menu-btn"
        aria-label="Menu"
        aria-expanded="false"
        aria-controls="sidebar"
      >
        <svg
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          aria-hidden="true"
        >
          <path d="M4 6h16M4 12h16M4 18h16" />
        </svg>
      </button>
      <img
        class="brand-logo"
        src="https://res.cloudinary.com/j7xyduzb/image/upload/v1791200860/brain_logo_1.png"
        alt=""
        width="32"
        height="32"
      />
      <p class="brand-name">BrainFlip</p>
      <div class="auth-area" id="auth-area"></div>
    </header>

    <div class="scrim" id="scrim" hidden></div>

    <aside class="sidebar" id="sidebar" aria-label="Main navigation">
      <div class="brand">
        <img
          class="brand-logo"
          src="https://res.cloudinary.com/j7xyduzb/image/upload/v1791200860/brain_logo_1.png"
          alt=""
          width="40"
          height="40"
        />
        <div>
          <p class="brand-name">BrainFlip</p>
          <p class="brand-tagline">Flip it till you know it.</p>
        </div>
        <button class="close-btn" id="close-btn" aria-label="Close menu">
          <svg
            width="22"
            height="22"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            aria-hidden="true"
          >
            <path d="M6 6l12 12M18 6L6 18" />
          </svg>
        </button>
      </div>

      <nav aria-label="Screens">
        <ul class="nav-list">
          <li>
            <a class="nav-link" href="#/home" data-route="home">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M3 11l9-8 9 8M5 10v10h14V10" />
              </svg>
              <span>Home</span>
            </a>
          </li>
          <li>
            <a class="nav-link" href="#/flashcards" data-route="flashcards">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="5" y="3" width="14" height="18" rx="3" />
              </svg>
              <span>Flashcards</span>
            </a>
          </li>
          <li>
            <a class="nav-link" href="#/quiz" data-route="quiz">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01" />
              </svg>
              <span>Quiz</span>
            </a>
          </li>
          <li>
            <a class="nav-link" href="#/results" data-route="results">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M5 20v-6M12 20V5M19 20V10" />
              </svg>
              <span>Results</span>
            </a>
          </li>
          <li>
            <a class="nav-link" href="#/decks" data-route="decks">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="8" y="3" width="13" height="13" rx="3" />
                <path d="M16 20H6a3 3 0 0 1-3-3V8" />
              </svg>
              <span>Decks</span>
            </a>
          </li>
          <li>
            <a class="nav-link" href="#/review" data-route="review">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
              <span>Review Answers</span>
            </a>
          </li>
          <li>
            <a class="nav-link" href="#/progress" data-route="progress">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M3 17l6-6 4 4 8-8M15 7h6v6" />
              </svg>
              <span>Progress</span>
            </a>
          </li>
        </ul>
      </nav>

      <div class="keep-going">
        <strong>Keep going!</strong>
        <span>Small steps make big progress.</span>
      </div>
    </aside>

    <main class="screen" id="screen" tabindex="-1"></main>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
